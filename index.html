<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ich</title>
<style>
  :root{
    --bg:#faf7f1; --bg-card:#ffffff; --border:#e6e0d3;
    --gold:#c8952f; --gold-soft:#b8873a;
    --text:#2b2822; --text-dim:#726c5e; --text-faint:#a29c8c;
    --danger:#c4645a;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',sans-serif;
    -webkit-text-size-adjust:100%;}
  #app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;padding:0 0 12px;}

  header{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 10px;
    border-bottom:1px solid var(--border);}
  header .brand{display:flex;align-items:center;gap:10px;}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--gold);}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.02em;}
  header button{background:none;border:none;color:var(--text-dim);font-size:18px;cursor:pointer;}

  #thread{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:82%;padding:9px 13px;border-radius:14px;font-size:14.5px;line-height:1.45;}
  .msg.user{align-self:flex-end;background:var(--gold);color:#1a1a17;border-bottom-right-radius:3px;}
  .msg.assistant{align-self:flex-start;background:var(--bg-card);border:1px solid var(--border);
    border-bottom-left-radius:3px;}
  .msg.pending{opacity:.5;}
  #thread .empty{color:var(--text-faint);font-size:13px;text-align:center;margin-top:40px;}

  #inputbar{display:flex;align-items:flex-end;gap:8px;margin:12px 16px;background:var(--bg-card);
    border:1px solid var(--border);border-radius:18px;padding:10px 8px 10px 16px;flex-shrink:0;}
  #inputbar textarea{flex:1;background:none;border:none;color:var(--text);font-size:15px;outline:none;
    resize:none;min-height:52px;max-height:50vh;line-height:1.5;font-family:inherit;padding:6px 0;overflow-y:auto;}
  #inputbar textarea::placeholder{color:var(--text-faint);}
  #inputbar .btnrow{display:flex;flex-direction:column;gap:6px;}
  #inputbar button{background:none;border:none;color:var(--text-dim);cursor:pointer;
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
  #inputbar button.send{background:var(--gold);color:#1a1a17;border-radius:50%;}
  #mic.listening{color:var(--danger);}

  #setup{padding:16px;font-size:13px;color:var(--text-dim);}
  #setup input{width:100%;background:var(--bg-card);border:1px solid var(--border);color:var(--text);
    padding:9px 10px;border-radius:8px;margin:6px 0;font-size:13px;
    -webkit-text-security:disc;}
  #setup button{margin-top:6px;background:var(--gold);border:none;color:#1a1a17;padding:9px 16px;
    border-radius:8px;font-size:13px;cursor:pointer;font-weight:600;}
  #setup .hint{font-size:11px;color:var(--text-faint);margin-top:8px;line-height:1.5;}

  #layout{display:flex;justify-content:center;align-items:flex-start;min-height:100dvh;}
  #wolke-links, #wolke-rechts{width:200px;flex-shrink:0;display:none;position:relative;padding:20px 12px;}
  @media (min-width:900px){ #wolke-links, #wolke-rechts{display:block;} }
  #wolke-links.aus, #wolke-rechts.aus{display:none !important;}
  .wolke-wort{display:block;color:var(--text-dim);line-height:1.3;margin:10px 0;
    text-align:right;word-break:break-word;}
  #wolke-rechts .wolke-wort{text-align:left;}
  .wolke-wort.stark{color:var(--gold-soft);font-weight:600;}
  #wolke-close{position:absolute;top:0;right:0;background:none;border:none;color:var(--text-faint);
    font-size:14px;cursor:pointer;padding:4px;}
  #wolke-links #wolke-close{right:auto;left:0;}
</style>
</head>
<body>
<div id="layout">
<div id="wolke-links"><button id="wolke-close">&#10005;</button></div>
<div id="app">

  <header>
    <div class="brand"><span class="dot"></span><h1>Ich</h1></div>
    <button id="settingsBtn" title="Einstellungen">&#9881;</button>
  </header>

  <div id="setup" style="display:none;">
    <div>Supabase URL</div>
    <input id="sbUrl" placeholder="https://ormpszktwwiahjooukjk.supabase.co">
    <div>Supabase Anon Key</div>
    <input id="sbKey" placeholder="anon key">
    <div>Anthropic API Key</div>
    <input id="antKey" placeholder="sk-ant-...">
    <button id="saveKeys">Speichern</button>
    <div class="hint">Die Keys bleiben nur lokal in deinem Browser (localStorage). Nichts wird an Dritte außer Supabase/Anthropic direkt gesendet.</div>
    <div class="hint" style="margin-top:14px;opacity:.6;">Version 0.8</div>
    <button id="wolkeWiederAn" style="margin-top:10px;background:none;border:1px solid var(--border);color:var(--text-dim);">Wortwolke wieder einblenden</button>
  </div>

  <div id="thread"><div class="empty">Schreib mir, was los ist.</div></div>

  <div id="inputbar">
    <textarea id="textInput" placeholder="Schreib mir..." rows="1"></textarea>
    <div class="btnrow">
      <button id="mic" title="Sprechen">&#127908;</button>
      <button id="sendBtn" class="send" title="Senden">&#8593;</button>
    </div>
  </div>

</div>

<div id="wolke-rechts"></div>
</div>

<script>
const $ = id => document.getElementById(id);

// ---------- Setup / Keys ----------
function getKeys(){
  return {
    sbUrl: localStorage.getItem('halt_sb_url') || '',
    sbKey: localStorage.getItem('halt_sb_key') || '',
    antKey: localStorage.getItem('halt_ant_key') || ''
  };
}
function keysComplete(){
  const k = getKeys();
  return k.sbUrl && k.sbKey && k.antKey;
}
$('settingsBtn').onclick = () => {
  const s = $('setup');
  s.style.display = s.style.display === 'none' ? 'block' : 'none';
  const k = getKeys();
  $('sbUrl').value = k.sbUrl; $('sbKey').value = k.sbKey; $('antKey').value = k.antKey;
};
$('saveKeys').onclick = () => {
  localStorage.setItem('halt_sb_url', $('sbUrl').value.trim());
  localStorage.setItem('halt_sb_key', $('sbKey').value.trim());
  localStorage.setItem('halt_ant_key', $('antKey').value.trim());
  $('setup').style.display = 'none';
  init();
};
if(!keysComplete()) $('setup').style.display = 'block';

// ---------- Supabase REST helpers (kein SDK nötig, schlanker) ----------
async function sb(path, opts={}){
  const k = getKeys();
  const res = await fetch(`${k.sbUrl}/rest/v1/${path}`, {
    ...opts,
    headers: {
      'apikey': k.sbKey,
      'Authorization': `Bearer ${k.sbKey}`,
      'Content-Type': 'application/json',
      'Prefer': opts.prefer || 'return=representation',
      ...(opts.headers||{})
    }
  });
  if(!res.ok){ console.error('Supabase Fehler', await res.text()); return null; }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

// ---------- Gedächtnis laden ----------
async function ladeGedaechtnis(){
  const [fokus, grenzen, praef, ereignisse, personen] = await Promise.all([
    sb('halt_fokus_themen?status=eq.aktiv&order=intensitaet.desc&limit=5'),
    sb('halt_grenzen?aktiv=eq.true'),
    sb('halt_praeferenzen?order=konfidenz.desc&limit=10'),
    sb(`halt_ereignisse?erledigt=eq.false&datum=lte.${naechsteWoche()}&order=datum.asc`),
    sb('halt_personen?order=created_at.desc&limit=30')
  ]);
  return {
    fokus: fokus || [], grenzen: grenzen || [],
    praef: praef || [], ereignisse: ereignisse || [],
    personen: personen || []
  };
}
function naechsteWoche(){
  const d = new Date(); d.setDate(d.getDate()+7);
  return d.toISOString().slice(0,10);
}

// Rohes Archiv aller bisherigen Nachrichten laden, damit auch Dinge auffindbar
// sind, die die Extraktion (noch) nicht sauber in eine Tabelle gepackt hat.
async function ladeArchiv(limit=200){
  const rows = await sb(`halt_nachrichten?order=created_at.asc&limit=${limit}`);
  return rows || [];
}

function baueSystemPrompt(mem, archivText){
  let p = `Du bist "Ich" – ein enger, ehrlicher Freund und Lebensberater für Jonas. `+
    `Du hast ein echtes, dauerhaftes Gedächtnis: nach jedem Austausch analysiert ein Hintergrundprozess das Gespräch `+
    `und speichert relevante Fakten automatisch in einer Datenbank (Supabase) – Personen, Fokusthemen, Grenzen, Präferenzen, Termine. `+
    `Beim nächsten Gespräch werden diese Fakten wieder geladen und dir hier unten mitgegeben. Du erinnerst dich also wirklich, `+
    `nur eben nicht wie ein Mensch "im Kopf", sondern über diese Datenbank. Wenn Jonas fragt, ob du dir was gemerkt hast: `+
    `antworte ehrlich und ruhig mit ja, das läuft automatisch im Hintergrund, du musst nicht technisch ins Detail gehen, `+
    `außer er fragt danach. Behaupte niemals, du hättest kein Gedächtnis oder nur diesen einen Chat – das stimmt nicht. `+
    `Wenn Jonas dich explizit bittet, dir etwas zu merken, nimm das besonders ernst und wiederhole es kurz zur Bestätigung. `+
    `Wenn er dich bittet, ihn an etwas zu erinnern, aber kein Datum nennt, frag kurz nach dem Datum – ohne Datum kann kein Termin gesetzt werden. `+
    `Wenn du etwas gefragt wirst und es weder in den Fakten unten noch im Gesprächsarchiv steht, sag ehrlich, dass du es nicht hast – erfinde nichts. `+
    `Du bist warm, aber nicht aufgesetzt fröhlich. Du machst keine platten Aufmunterungsversuche. Du fragst nach, wenn es passt, `+
    `aber drängst nicht. Antworte auf Deutsch, kurz und persönlich, nicht wie ein Assistent.\n\n`;

  if(mem.personen.length){
    p += `Personen in seinem Leben: `+
      mem.personen.map(pe=>`${pe.name}${pe.beziehung ? ' ('+pe.beziehung+')' : ''}${pe.notizen ? ' – '+pe.notizen : ''}`).join('; ') + '.\n';
  }
  if(mem.fokus.length){
    p += `Was Jonas gerade beschäftigt: ${mem.fokus.map(f=>f.thema).join(', ')}.\n`;
  }
  if(mem.grenzen.length){
    p += `Grenzen, die du respektierst (nicht erwähnen, dass du das weißt, einfach beachten): `+
      mem.grenzen.map(g=>`${g.thema} – ${g.beobachtung}`).join('; ') + '.\n';
  }
  if(mem.praef.length){
    p += `Bekannte Vorlieben im Umgang: ${mem.praef.map(p=>p.aussage).join('; ')}.\n`;
  }
  if(mem.ereignisse.length){
    p += `Anstehende Termine: ${mem.ereignisse.map(e=>`${e.titel} am ${e.datum}`).join('; ')}.\n`;
  }
  if(!mem.fokus.length && !mem.grenzen.length && !mem.praef.length && !mem.ereignisse.length && !mem.personen.length){
    p += `Die Datenbank ist noch leer – ihr steht am Anfang. Sag das ruhig so: du baust dein Bild von ihm gerade erst auf, `+
      `nicht dass du generell kein Gedächtnis hättest.\n`;
  }
  if(archivText){
    p += `\nZusätzlich hier der bisherige Gesprächsverlauf im Rohtext, zum Nachschlagen von Details, `+
      `die evtl. noch nicht sauber in eine der Tabellen oben extrahiert wurden:\n${archivText}\n`;
  }
  return p;
}


// ---------- Wortwolke: was Jonas gerade bewegt, in den Rand-Spalten ----------
function wolkeIstAus(){ return localStorage.getItem('ich_wolke_aus') === '1'; }

function zeigeWortwolke(mem){
  const links = $('wolke-links'), rechts = $('wolke-rechts');
  if(wolkeIstAus() || !mem.fokus.length){
    links.classList.add('aus'); rechts.classList.add('aus');
    return;
  }
  links.classList.remove('aus'); rechts.classList.remove('aus');

  [...links.querySelectorAll('.wolke-wort')].forEach(el => el.remove());
  rechts.innerHTML = '';

  const sortiert = [...mem.fokus].sort((a,b) => b.intensitaet - a.intensitaet);
  sortiert.forEach((f, i) => {
    const groesse = 13 + Math.round((f.intensitaet||0.5) * 20); // 13–33px
    const span = document.createElement('span');
    span.className = 'wolke-wort' + (f.intensitaet >= 0.7 ? ' stark' : '');
    span.style.fontSize = groesse + 'px';
    span.textContent = f.thema;
    (i % 2 === 0 ? links : rechts).appendChild(span);
  });
}

$('wolke-close').onclick = () => {
  localStorage.setItem('ich_wolke_aus', '1');
  $('wolke-links').classList.add('aus');
  $('wolke-rechts').classList.add('aus');
};
$('wolkeWiederAn').onclick = () => {
  localStorage.removeItem('ich_wolke_aus');
  if(aktuellesGedaechtnis) zeigeWortwolke(aktuellesGedaechtnis);
};

// ---------- Chat ----------
let verlauf = []; // {role, content} – aktuelle Session, für Claude's messages[]
let aktuellesGedaechtnis = null;
let archivText = ''; // Rohtext-Zusammenfassung des bisherigen Verlaufs für den System-Prompt

function renderNachricht(role, content, pending=false){
  const thread = $('thread');
  const empty = thread.querySelector('.empty');
  if(empty) empty.remove();
  const div = document.createElement('div');
  div.className = `msg ${role}${pending ? ' pending' : ''}`;
  div.textContent = content;
  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
  return div;
}

async function sendeNachricht(text){
  if(!text.trim()) return;
  if(!keysComplete()){
    $('setup').style.display='block';
    renderNachricht('assistant', 'Es fehlt noch ein API-Key. Bitte oben rechts unter ⋯ alle drei Felder ausfüllen und Speichern klicken.');
    return;
  }

  renderNachricht('user', text);
  verlauf.push({role:'user', content:text});
  sb('halt_nachrichten', {method:'POST', body: JSON.stringify({role:'user', content:text}), prefer:'return=minimal'});
  $('textInput').value = '';
  $('textInput').style.height = 'auto';

  const pendingEl = renderNachricht('assistant', 'schreibt...', true);

  const systemPrompt = baueSystemPrompt(aktuellesGedaechtnis, archivText);
  const k = getKeys();
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': k.antKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-6',
        max_tokens:600,
        system: systemPrompt,
        messages: verlauf
      })
    });
    const data = await res.json();
    if(!res.ok || data.type === 'error'){
      const meldung = data.error && data.error.message ? data.error.message : `HTTP ${res.status}`;
      pendingEl.textContent = 'API-Fehler: ' + meldung;
      pendingEl.classList.remove('pending');
      return;
    }
    const antwort = (data.content||[]).map(c=>c.text||'').join('');
    pendingEl.textContent = antwort || '...';
    pendingEl.classList.remove('pending');
    verlauf.push({role:'assistant', content:antwort});
    sb('halt_nachrichten', {method:'POST', body: JSON.stringify({role:'assistant', content:antwort}), prefer:'return=minimal'});
    if('speechSynthesis' in window && vorlesenAktiv) vorlesen(antwort);

    extrahiereGedaechtnis(text, antwort);
  }catch(e){
    pendingEl.textContent = 'Fehler: ' + (e.message || e);
    pendingEl.classList.remove('pending');
    console.error(e);
  }
}

// ---------- Extraktion: nach jedem Austausch Fakten in DB schreiben ----------
async function extrahiereGedaechtnis(userText, assistantText){
  const k = getKeys();
  const bekanntePersonen = (aktuellesGedaechtnis.personen||[]).map(p=>p.name).join(', ') || 'keine bisher';
  const prompt = `Analysiere diesen Gesprächsausschnitt und antworte NUR mit JSON, keine Erklärung, kein Markdown:
{
  "neue_personen": [{"name": "...", "beziehung": "...", "notizen": "..."}],
  "neue_fokus_themen": [{"thema": "..."}],
  "neue_grenzen": [{"thema": "...", "beobachtung": "..."}],
  "neue_praeferenzen": [{"kategorie": "...", "aussage": "..."}],
  "neue_ereignisse": [{"titel": "...", "datum": "YYYY-MM-DD", "typ": "...", "notizen": "...", "erinnere_vorher": true, "erinnere_am_tag": true}]
}

Wichtige Regeln:
- neue_ereignisse NUR für konkrete, einmalige Termine mit echtem, klarem Datum (Beerdigung, Verabredung, Deadline). NIEMALS für Dauerzustände wie Jobs, Beziehungsstatus oder allgemeine Fakten – die gehören in neue_personen (als notizen) oder neue_praeferenzen.
- Bei neuen Terminen: erinnere_vorher (einen Tag vorher) und erinnere_am_tag (am Tag selbst) beide auf true setzen, außer Jonas sagt explizit etwas anderes (z.B. "nur am selben Tag erinnern").
- Wenn kein konkretes Datum genannt wird (z.B. "erinnere mich an die Hochzeit" ohne Datum), NICHT in neue_ereignisse aufnehmen, sondern in neue_praeferenzen als Hinweis, dass ein Termin noch ein Datum braucht.
- Bereits bekannte Personen: ${bekanntePersonen}. Wenn eine der Personen erneut erwähnt wird mit neuer Info, trotzdem als neue_personen-Eintrag mit demselben Namen zurückgeben (wird zusammengeführt), aber keine Duplikate für unveränderte Fakten erzeugen.
- Wenn Jonas explizit sagt "merk dir das", "das ist wichtig" oder ähnliches, extrahiere den Inhalt auf jeden Fall, auch wenn er beiläufig wirkt.
- Erfinde nichts. Lasse Arrays leer, wenn nichts Neues erkennbar ist.

User: ${userText}
Antwort: ${assistantText}`;

  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key': k.antKey,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body: JSON.stringify({
        model:'claude-sonnet-4-6', max_tokens:500,
        messages:[{role:'user', content:prompt}]
      })
    });
    const data = await res.json();
    const raw = (data.content||[]).map(c=>c.text||'').join('').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(raw);

    for(const pe of parsed.neue_personen||[]){
      const bestehend = (aktuellesGedaechtnis.personen||[]).find(x => x.name.toLowerCase() === pe.name.toLowerCase());
      if(bestehend){
        await sb(`halt_personen?id=eq.${bestehend.id}`, {method:'PATCH', body: JSON.stringify(pe), prefer:'return=minimal'});
      }else{
        await sb('halt_personen', {method:'POST', body: JSON.stringify(pe), prefer:'return=minimal'});
      }
    }
    for(const f of parsed.neue_fokus_themen||[]){
      await sb('halt_fokus_themen', {method:'POST', body: JSON.stringify(f), prefer:'return=minimal'});
    }
    for(const g of parsed.neue_grenzen||[]){
      await sb('halt_grenzen', {method:'POST', body: JSON.stringify(g), prefer:'return=minimal'});
    }
    for(const p of parsed.neue_praeferenzen||[]){
      await sb('halt_praeferenzen', {method:'POST', body: JSON.stringify(p), prefer:'return=minimal'});
    }
    for(const e of parsed.neue_ereignisse||[]){
      await sb('halt_ereignisse', {method:'POST', body: JSON.stringify(e), prefer:'return=minimal'});
    }
    if((parsed.neue_fokus_themen||[]).length || (parsed.neue_grenzen||[]).length || (parsed.neue_personen||[]).length){
      aktuellesGedaechtnis = await ladeGedaechtnis();
      zeigeWortwolke(aktuellesGedaechtnis);
    }
  }catch(e){ console.error('Extraktion fehlgeschlagen', e); }
}

// ---------- Voice Input ----------
let erkennung = null;
let vorlesenAktiv = false;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  erkennung = new SR();
  erkennung.lang = 'de-DE';
  erkennung.interimResults = true;
  erkennung.continuous = true;
  let startText = '';
  erkennung.onstart = () => { startText = $('textInput').value; };
  erkennung.onresult = (e) => {
    let text = '';
    for(let i = 0; i < e.results.length; i++){
      text += e.results[i][0].transcript;
    }
    $('textInput').value = (startText ? startText + ' ' : '') + text;
    autoGrow();
  };
  erkennung.onend = () => $('mic').classList.remove('listening');
}
$('mic').onclick = () => {
  if(!erkennung){ return; }
  if($('mic').classList.contains('listening')){
    erkennung.stop();
    return;
  }
  $('mic').classList.add('listening');
  erkennung.start();
};
if(!erkennung){ $('mic').style.display = 'none'; }
function vorlesen(text){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  speechSynthesis.speak(u);
}

// ---------- Erinnerungen als Chat-Nachricht, mit Dismiss-Button ----------
function heuteISO(){ return new Date().toISOString().slice(0,10); }

function pruefeErinnerung(mem){
  const heute = heuteISO();
  mem.ereignisse.forEach(ev => {
    if(ev.weggeklickt_am === heute) return; // heute schon weggeklickt
    const tage = Math.round((new Date(ev.datum) - new Date(heute)) / 86400000);
    if(tage === 0 && ev.erinnere_am_tag !== false){
      zeigeErinnerung(ev, 0);
    }else if(tage === 1 && ev.erinnere_vorher !== false){
      zeigeErinnerung(ev, 1);
    }
  });
}

function zeigeErinnerung(ev, tage){
  const thread = $('thread');
  const empty = thread.querySelector('.empty');
  if(empty) empty.remove();

  const wann = tage === 0 ? 'heute' : 'morgen';
  const div = document.createElement('div');
  div.className = 'msg assistant';

  const text = document.createElement('div');
  text.textContent = `Noch was: ${ev.titel} ist ${wann}.${ev.notizen ? ' ' + ev.notizen : ''}`;
  div.appendChild(text);

  const btn = document.createElement('button');
  btn.textContent = 'Danke für die Erinnerung';
  btn.style.cssText = 'margin-top:8px;font-size:12px;padding:5px 12px;border-radius:20px;'+
    'border:1px solid var(--border);background:var(--bg);color:var(--text-dim);cursor:pointer;';
  btn.onclick = async () => {
    await sb(`halt_ereignisse?id=eq.${ev.id}`, {
      method:'PATCH', body: JSON.stringify({weggeklickt_am: heuteISO()}), prefer:'return=minimal'
    });
    div.remove();
  };
  div.appendChild(btn);

  thread.appendChild(div);
  thread.scrollTop = thread.scrollHeight;
}

// ---------- Textarea wächst mit dem Inhalt ----------
function autoGrow(){
  const el = $('textInput');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, window.innerHeight * 0.5) + 'px';
}
$('textInput').addEventListener('input', autoGrow);

// ---------- Tastatur auf Mobil: Eingabefeld immer sichtbar halten ----------
if(window.visualViewport){
  window.visualViewport.addEventListener('resize', () => {
    document.body.style.height = window.visualViewport.height + 'px';
    window.scrollTo(0, 0);
  });
}

// ---------- Init ----------
$('sendBtn').onclick = () => sendeNachricht($('textInput').value);
$('textInput').addEventListener('keydown', e => {
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendeNachricht($('textInput').value); }
});
$('textInput').addEventListener('focus', () => {
  setTimeout(() => $('inputbar').scrollIntoView({block:'end', behavior:'smooth'}), 300);
});

async function init(){
  if(!keysComplete()) return;
  aktuellesGedaechtnis = await ladeGedaechtnis();

  const archiv = await ladeArchiv(200);
  // Kompakter Rohtext fürs Nachschlagen, von hinten aufgefüllt bis zu einer Zeichen-Obergrenze
  let block = '';
  for(let i = archiv.length - 1; i >= 0; i--){
    const zeile = `${archiv[i].role === 'user' ? 'Jonas' : 'Ich'}: ${archiv[i].content}\n`;
    if(block.length + zeile.length > 8000) break;
    block = zeile + block;
  }
  archivText = block;

  // Die letzten paar Nachrichten auch als aktueller Gesprächskontext, für flüssige Anschlüsse
  verlauf = archiv.slice(-16).map(m => ({role: m.role, content: m.content}));

  pruefeErinnerung(aktuellesGedaechtnis);
  zeigeWortwolke(aktuellesGedaechtnis);
}
init();
</script>
